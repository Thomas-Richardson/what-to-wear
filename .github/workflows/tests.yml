# Runs every test on GitHub whenever code is pushed, and shows a green tick or red cross.
# RealNoteTest skips itself here, because Richie's vault is only on his Mac.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
